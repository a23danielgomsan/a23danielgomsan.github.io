<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Daniel">
    <meta name="description" content="Formulario para reservar mesa en el restaurante">
    <meta name="keywords" content="reserva, mesa, restaurante, formulario">
    <title>Haz una reserva</title>
</head>
<body>
    <header>
        <h1>Haz una reserva</h1>
    </header>

    <nav>
        <a href="restaurante.html">Volver al menú principal del restaurante</a>
    </nav>

    <main>
        <form action="#" method="post">
            <p>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Su nombre" required>
            </p>
            <p>
                <label for="clientes">Número de clientes:</label>
                <input type="number" id="clientes" name="clientes" min="1" required>
            </p>
            <p>
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" placeholder="Su correo electrónico" required>
            </p>
            <p>
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Su teléfono" required>
            </p>
            <p>
                <label for="fecha">Fecha de la reserva:</label>
                <input type="date" id="fecha" name="fecha" required>
            </p>
            <p>
                <label for="hora">Hora de la reserva:</label>
                <input type="time" id="hora" name="hora" required>
            </p>
            <p>
                <label for="mensaje">Mensaje:</label>
                <input type="text" id="mensaje" name="mensaje" placeholder="Su mensaje">
            </p>
            <p>
                <button type="submit">SOLICITAR RESERVA</button>
            </p>
            <p>Si desea saber cómo protegemos sus datos, consulte nuestra <a href="#"><strong>Política de privacidad</strong></a></p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 - Daniel - Desarrollo web</p>
    </footer>
</body>
</html>
